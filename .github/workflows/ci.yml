name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # SwiftShader draws a frame a second; the interaction suite takes ~15 min
    # there. See adaptToRenderer() in tools/test-interaction.mjs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run audit:data
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Boot and test
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:5174/ >/dev/null && break
            sleep 1
          done
          npm run test:cartography
          npm run test:interaction
