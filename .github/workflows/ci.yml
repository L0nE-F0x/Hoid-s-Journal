name: check

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes the older run moot. Runs on master are
# each a deploy, so they all finish.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # SwiftShader draws a frame a second; the interaction suite takes ~15 min
    # there. See adaptToRenderer() in tools/test-interaction.mjs.
    timeout-minutes: 45
    defaults:
      run:
        # `bash -eo pipefail`, so a failure inside a pipe fails the step too.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run audit:data
      # What Netlify runs. The typecheck again is cheap; a failure only Rollup
      # sees would otherwise reach the deploy with this job green.
      - run: npm run build
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - name: Production build under netlify.toml (CSP, worker, 404, offline)
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node .github/scripts/smoke-dist.mjs
      - name: Start the dev server
        run: |
          npm run dev > "$RUNNER_TEMP/vite.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::the dev server did not answer on 127.0.0.1:5174 within 60 s"
          cat "$RUNNER_TEMP/vite.log"
          exit 1
      - name: Cartography
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:cartography
      - name: Interaction
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run test:interaction
      - name: Dev server log
        if: failure()
        run: cat "$RUNNER_TEMP/vite.log" 2>/dev/null || true
