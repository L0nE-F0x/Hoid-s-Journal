<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hoid’s Journal</title>
    <meta name="description" content="Hoid’s Journal: an unofficial, spoiler-aware, nested atlas of Brandon Sanderson’s Cosmere. Fly the systems, walk the Realms, and keep a journal that will not spoil you." />
    <meta name="theme-color" content="#05060c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hoid’s Journal" />
    <link rel="icon" type="image/svg+xml" href="./mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hoid’s Journal" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Hoid’s Journal" />
    <meta property="og:description" content="An unofficial nested atlas of the Cosmere. Fly the systems. Walk the Realms. Keep a journal that will not spoil you." />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hoid’s Journal. An unofficial nested atlas of the Cosmere." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hoid’s Journal" />
    <meta name="twitter:description" content="An unofficial nested atlas of the Cosmere." />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />
    <meta name="twitter:image:alt" content="Hoid’s Journal over a live Roshar." />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; }
      body { font-family: ui-sans-serif, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif; color: #e4e7ef; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }

      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; background: radial-gradient(ellipse at 50% 44%, #0a0d1c 0%, #05060c 70%);
        transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot-scan {
        position: absolute; inset: 0; pointer-events: none;
        background: repeating-linear-gradient(
          0deg, rgba(140, 180, 255, 0.03) 0px, rgba(140, 180, 255, 0.03) 1px,
          transparent 1px, transparent 3px
        );
      }
      /* The mark is a square plate on near-black, like the title screen's.
         A radial mask takes the corners off so the slow turn reads as a seal
         rotating rather than a photograph being spun. */
      #boot-mark {
        width: 84px; height: 84px;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 46%, rgba(0,0,0,0.55) 60%, transparent 72%);
        mask-image: radial-gradient(circle at 50% 50%, #000 46%, rgba(0,0,0,0.55) 60%, transparent 72%);
        filter: drop-shadow(0 0 18px rgba(150, 200, 255, 0.24));
        animation: boot-spin 120s linear infinite;
      }
      #boot-title {
        font-family: ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino,
          Georgia, 'Liberation Serif', 'Times New Roman', serif;
        font-size: clamp(19px, 4.1vw, 38px); font-weight: 400;
        letter-spacing: 0.28em; text-indent: 0.28em; text-transform: uppercase;
        color: #f2ece0; text-align: center;
        max-width: calc(100% - 32px); line-height: 1.16;
        text-shadow: 0 2px 26px rgba(0,0,0,0.8), 0 0 52px rgba(150,190,255,0.14);
      }
      #boot-sub {
        font-size: 10px; letter-spacing: 0.32em; text-indent: 0.32em;
        text-transform: uppercase; color: #d9b25f; opacity: 0.85; margin-top: -2px;
        text-align: center; max-width: min(92vw, 420px); line-height: 1.7;
      }
      #boot-pips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 220px; }
      #boot-pips span { width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
      #boot-track {
        width: min(300px, 58vw); height: 1px; margin-top: 10px;
        background: rgba(206, 221, 255, 0.16);
        position: relative; overflow: visible; border-radius: 2px;
      }
      #boot-fill {
        position: absolute; inset: 0 auto 0 0; width: 0%;
        background: #d9b25f;
        box-shadow: 0 0 12px rgba(217, 178, 95, 0.8);
        transition: width 320ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-label {
        font-size: 9.5px; letter-spacing: 0.26em; text-transform: uppercase;
        color: rgba(151, 160, 180, 0.86); font-variant-numeric: tabular-nums;
      }
      #boot-label.error { color: #ff8f7a; letter-spacing: 0.08em; text-transform: none; max-width: 46ch; text-align: center; line-height: 1.6; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #boot, #boot-fill { transition: none; }
        #boot-mark, #boot-title { animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="A live map of the Cosmere: the orrery, its worlds and their surfaces. The controls and the text of the journal are in the panels around it."></canvas>
    <div id="ui-root"></div>
    <div id="boot">
      <div id="boot-scan"></div>
      <img id="boot-mark" src="./logo.jpg" alt="" width="96" height="96" />
      <div id="boot-title">Hoid’s Journal</div>
      <div id="boot-sub">Kept by a man with too many names</div>
      <div id="boot-pips" aria-hidden="true">
        <span style="background:#38bdf8;color:#38bdf8"></span>
        <span style="background:#4ade80;color:#4ade80"></span>
        <span style="background:#ef4444;color:#ef4444"></span>
        <span style="background:#77aaff;color:#77aaff"></span>
        <span style="background:#f59e0b;color:#f59e0b"></span>
        <span style="background:#a78bfa;color:#a78bfa"></span>
        <span style="background:#f472b6;color:#f472b6"></span>
        <span style="background:#f97316;color:#f97316"></span>
      </div>
      <div id="boot-track"><div id="boot-fill"></div></div>
      <div id="boot-label">Opening the journal</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
