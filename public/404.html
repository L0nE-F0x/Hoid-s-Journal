<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Not in the journal — Hoid’s Journal</title>
    <meta name="description" content="That page is not in Hoid’s Journal. Return to the atlas." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#05060c" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #05060c; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; padding: 40px 20px; min-height: 100vh; text-align: center;
        background: radial-gradient(ellipse at 50% 42%, #0a0d1c 0%, #05060c 70%);
        font-family: ui-sans-serif, Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #e4e7ef;
      }
      img {
        width: 82px; height: 82px;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 46%, rgba(0,0,0,0.55) 60%, transparent 72%);
        mask-image: radial-gradient(circle at 50% 50%, #000 46%, rgba(0,0,0,0.55) 60%, transparent 72%);
        filter: drop-shadow(0 0 18px rgba(150, 200, 255, 0.24));
      }
      h1 {
        margin: 0; font-weight: 400; line-height: 1.08;
        font-family: ui-serif, 'Iowan Old Style', 'Palatino Linotype', Palatino,
          Georgia, 'Liberation Serif', 'Times New Roman', serif;
        font-size: clamp(23px, 5vw, 44px);
        letter-spacing: 0.28em; text-indent: 0.28em; text-transform: uppercase;
        color: #f2ece0; max-width: calc(100% - 24px);
      }
      p.sub {
        margin: 0; font-size: 10px; letter-spacing: 0.32em; text-indent: 0.32em;
        text-transform: uppercase; color: #d9b25f; opacity: 0.85;
      }
      blockquote {
        margin: 12px 0 0; max-width: 40ch;
        font-family: ui-serif, 'Iowan Old Style', Palatino, Georgia, serif;
        font-style: italic; font-size: clamp(15px, 2.1vw, 19px); line-height: 1.62;
        color: #cdd4e4;
      }
      cite {
        display: block; margin-top: 10px; font-style: normal; font-size: 9.5px;
        letter-spacing: 0.26em; text-transform: uppercase; color: rgba(151, 160, 180, 0.86);
      }
      a.go {
        margin-top: 14px; display: inline-block; padding: 11px 22px;
        border: 1px solid rgba(217, 178, 95, 0.55); color: #d9b25f;
        font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase;
        text-decoration: none; transition: background 220ms, color 220ms;
      }
      a.go:hover { background: rgba(217, 178, 95, 0.12); color: #f2ece0; }
      hr { width: min(420px, 82vw); height: 1px; border: 0; margin: 4px 0;
        background: linear-gradient(90deg, transparent, rgba(206,221,255,0.18) 18%, rgba(206,221,255,0.18) 82%, transparent); }
    </style>
  </head>
  <body>
    <img src="/logo.jpg" alt="" width="82" height="82" />
    <hr />
    <h1>Not in the journal</h1>
    <hr />
    <p class="sub">Four hundred and four</p>
    <blockquote>
      I have written down a great deal, and lost more of it than I care to admit.
      This page is among the lost.
      <cite>Cephandrius, in his own hand</cite>
    </blockquote>
    <a class="go" href="/">Back to the Cosmere</a>
  </body>
</html>
