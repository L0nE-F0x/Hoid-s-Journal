<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!--
    The journal's mark, reduced for a 16px tab: the hexagon, the ring and the
    four-point rose of public/logo.jpg, without the crescents or the sunburst.
    Below about 48px those details collapse into grey noise; the silhouette
    still reads. Geometry is measured off the artwork — pointy-top hexagon,
    circumradius 24, ring at 7.4, rose tips at 16.
  -->
  <polygon points="32,8 52.8,20 52.8,44 32,56 11.2,44 11.2,20"
           fill="none" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="7.4" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <g fill="#ffffff">
    <path d="M32 32 Q28 23.6 32 16 Q36 23.6 32 32 Z"/>
    <path d="M32 32 Q40.4 28 48 32 Q40.4 36 32 32 Z"/>
    <path d="M32 32 Q36 40.4 32 48 Q28 40.4 32 32 Z"/>
    <path d="M32 32 Q23.6 36 16 32 Q23.6 28 32 32 Z"/>
  </g>
  <circle cx="32" cy="32" r="2.4" fill="#ffffff"/>
</svg>
